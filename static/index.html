<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Телефонный справочник</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="bg-white border-bottom">
        <nav class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3" aria-label="Основная навигация">
            <a class="navbar-brand fw-semibold" href="/">Телефонный справочник</a>
            <div id="account-nav" class="d-flex flex-wrap align-items-center gap-3" hidden>
                <a href="/" aria-current="page">Контакты</a>
                <a href="/static/profile.html">Профиль</a>
                <button id="logout" class="btn btn-outline-secondary btn-sm" type="button">Выйти</button>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <div id="message" class="alert" role="status" hidden></div>

        <div id="auth-area" class="auth-panel" hidden>
            <h1 class="h3 mb-3">Вход в справочник</h1>
            <div class="row g-3">
                <div class="col-md-6">
                    <form id="login-form" class="card card-body h-100" method="post">
                        <h2 class="h5 mb-3">Вход</h2>
                        <label class="form-label" for="login-name">Имя пользователя</label>
                        <input id="login-name" class="form-control mb-3" name="user_name" autocomplete="username" maxlength="50" required>
                        <label class="form-label" for="login-password">Пароль</label>
                        <input id="login-password" class="form-control mb-3" name="password" type="password" autocomplete="current-password" required>
                        <button class="btn btn-primary align-self-start" type="submit">Войти</button>
                    </form>
                </div>
                <div class="col-md-6">
                    <form id="register-form" class="card card-body h-100" method="post">
                        <h2 class="h5 mb-3">Регистрация</h2>
                        <label class="form-label" for="register-name">Имя пользователя</label>
                        <input id="register-name" class="form-control mb-3" name="user_name" autocomplete="username" minlength="3" maxlength="50" required>
                        <label class="form-label" for="register-password">Пароль</label>
                        <input id="register-password" class="form-control" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
                        <div id="password-hint" class="form-text mb-3">Минимум 8 символов</div>
                        <button class="btn btn-outline-primary align-self-start" type="submit">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>

        <section id="contacts-area" hidden>
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <h1 class="h3 mb-0">Контакты</h1>
                <button id="add-contact" class="btn btn-primary" type="button">Добавить контакт</button>
            </div>

            <form id="contact-form" class="card card-body mb-3" method="post" hidden>
                <h2 id="contact-form-title" class="h5 mb-3">Новый контакт</h2>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label" for="contact-name">Имя</label>
                        <input id="contact-name" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="contact-phone">Телефон</label>
                        <input id="contact-phone" class="form-control" type="tel" maxlength="30" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="contact-group">Группа</label>
                        <select id="contact-group" class="form-select">
                            <option value="">Без группы</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button id="save-contact" class="btn btn-primary" type="submit">Сохранить</button>
                    <button id="cancel-contact" class="btn btn-outline-secondary" type="button">Отмена</button>
                </div>
            </form>

            <form id="filter-form" class="row g-2 align-items-end mb-3">
                <div class="col-12 col-md">
                    <label class="form-label" for="search">Поиск</label>
                    <input id="search" class="form-control" type="search" placeholder="Имя или телефон">
                </div>
                <div class="col-6 col-md">
                    <label class="form-label" for="filter-group">Группа</label>
                    <select id="filter-group" class="form-select">
                        <option value="">Все группы</option>
                    </select>
                </div>
                <div class="col-6 col-md">
                    <label class="form-label" for="sort-by">Сортировка</label>
                    <select id="sort-by" class="form-select">
                        <option value="name">По имени</option>
                        <option value="phone">По телефону</option>
                        <option value="created_at">По дате добавления</option>
                    </select>
                </div>
                <div class="col-8 col-md">
                    <label class="form-label" for="sort-order">Порядок</label>
                    <select id="sort-order" class="form-select">
                        <option value="asc">По возрастанию</option>
                        <option value="desc">По убыванию</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" type="submit">Применить</button>
                </div>
            </form>

            <div class="table-responsive border rounded bg-white mb-3">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Имя</th>
                            <th scope="col">Телефон</th>
                            <th scope="col">Группа</th>
                            <th scope="col">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="contact-rows"></tbody>
                </table>
            </div>
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                <p id="page-status" class="text-body-secondary mb-0" role="status">Загрузка контактов…</p>
                <div class="btn-group" role="group" aria-label="Страницы контактов">
                    <button id="previous-page" class="btn btn-outline-secondary btn-sm" type="button" disabled>Назад</button>
                    <button id="next-page" class="btn btn-outline-secondary btn-sm" type="button" disabled>Дальше</button>
                </div>
            </div>
        </section>

        <section id="groups-area" class="card card-body mt-4" hidden>
            <h2 class="h5 mb-3">Группы</h2>
            <form id="group-form" class="row g-2 align-items-end mb-3" method="post">
                <div class="col-sm-6 col-lg-4">
                    <label class="form-label" for="group-name">Название группы</label>
                    <input id="group-name" class="form-control" maxlength="60" required>
                </div>
                <div class="col-auto">
                    <button id="add-group" class="btn btn-outline-primary" type="submit">Добавить группу</button>
                </div>
            </form>
            <p id="no-groups" class="text-body-secondary mb-0" hidden>Групп пока нет.</p>
            <ul id="group-list" class="list-group"></ul>
        </section>
    </main>

    <script type="module" src="/static/auth.js"></script>
    <script type="module" src="/static/contacts.js"></script>
</body>
</html>

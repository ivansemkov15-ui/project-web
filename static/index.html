<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Телефонный справочник</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="bg-white border-bottom">
        <nav class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3" aria-label="Основная навигация">
            <a class="navbar-brand fw-semibold" href="/">Телефонный справочник</a>
            <div id="account-nav" class="d-flex flex-wrap align-items-center gap-3" hidden>
                <a href="/" aria-current="page">Контакты</a>
                <a href="/static/profile.html">Профиль</a>
                <button id="logout" class="btn btn-outline-secondary btn-sm" type="button">Выйти</button>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <div id="message" class="alert" role="status" hidden></div>

        <div id="auth-area" class="auth-panel" hidden>
            <h1 class="h3 mb-3">Вход в справочник</h1>
            <div class="row g-3">
                <div class="col-md-6">
                    <form id="login-form" class="card card-body h-100" method="post">
                        <h2 class="h5 mb-3">Вход</h2>
                        <label class="form-label" for="login-name">Имя пользователя</label>
                        <input id="login-name" class="form-control mb-3" name="user_name" autocomplete="username" maxlength="50" required>
                        <label class="form-label" for="login-password">Пароль</label>
                        <input id="login-password" class="form-control mb-3" name="password" type="password" autocomplete="current-password" required>
                        <button class="btn btn-primary align-self-start" type="submit">Войти</button>
                    </form>
                </div>
                <div class="col-md-6">
                    <form id="register-form" class="card card-body h-100" method="post">
                        <h2 class="h5 mb-3">Регистрация</h2>
                        <label class="form-label" for="register-name">Имя пользователя</label>
                        <input id="register-name" class="form-control mb-3" name="user_name" autocomplete="username" minlength="3" maxlength="50" required>
                        <label class="form-label" for="register-password">Пароль</label>
                        <input id="register-password" class="form-control" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
                        <div id="password-hint" class="form-text mb-3">Минимум 8 символов</div>
                        <button class="btn btn-outline-primary align-self-start" type="submit">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>

        <section id="contacts-area" hidden>
            <h1 class="h3">Контакты</h1>
        </section>
    </main>

    <script type="module" src="/static/auth.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль — Телефонный справочник</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-body-tertiary">
    <header class="bg-white border-bottom">
        <nav class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3" aria-label="Основная навигация">
            <a class="navbar-brand fw-semibold" href="/">Телефонный справочник</a>
            <div class="d-flex flex-wrap align-items-center gap-3">
                <a href="/">Контакты</a>
                <a href="/dashboard">Статистика</a>
                <a href="/static/profile.html" aria-current="page">Профиль</a>
                <button id="logout" class="btn btn-outline-secondary btn-sm" type="button">Выйти</button>
            </div>
        </nav>
    </header>

    <main id="profile-area" class="container py-4" hidden>
        <h1 class="h3 mb-3">Профиль</h1>
        <div id="message" class="alert" role="status" hidden></div>
        <div class="card card-body profile-panel">
            <dl class="mb-3">
                <dt>Имя пользователя</dt>
                <dd id="profile-name">—</dd>
                <dt>ID пользователя</dt>
                <dd id="profile-id" class="mb-0">—</dd>
            </dl>
            <button id="refresh-token" class="btn btn-outline-primary align-self-start" type="button">Обновить токен</button>
        </div>
    </main>

    <script type="module" src="/static/profile.js"></script>
</body>
</html>

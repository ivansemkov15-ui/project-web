name: phonebook-backend

services:
  supporting:
    build: .
    command: uvicorn supporting_api:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"

  core:
    build: .
    command: python app.py
    environment:
      DATABASE_URL: postgresql://phonebook_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/phonebook
      SUPPORTING_URL: http://supporting:8001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      supporting:
        condition: service_started

networks:
  default:
    name: phonebook-shared
    external: true
